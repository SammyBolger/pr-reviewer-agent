[project]
name = "pr-reviewer-agent"
version = "0.1.0"
description = "GitHub App that reviews pull requests with an LLM agent using RAG over the repo."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "anthropic>=0.40",
    "langgraph>=0.2",
    "chromadb>=0.5",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
