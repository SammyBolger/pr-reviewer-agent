# fly.toml app configuration file generated for pr-reviewer-agent on 2026-08-17T19:15:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pr-reviewer-agent'
primary_region = 'ord'

[build]

[[mounts]]
  source = 'prreviewer_data'
  destination = '/app/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
