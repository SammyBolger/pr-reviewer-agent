app = "pr-reviewer-agent"
primary_region = "ord"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  # Keep at least one machine running so cold-starts do not stall webhooks.
  # ~$2/month for shared-cpu-1x 512 MB always-on.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "get"
    timeout = "5s"
    path = "/health"

[[mounts]]
  source = "prreviewer_data"
  destination = "/app/data"

[[vm]]
  # 1 GB is needed because Chroma's default embedder (all-MiniLM-L6-v2)
  # loads ~250 MB into RAM on first review. 512 MB caused OOM.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
